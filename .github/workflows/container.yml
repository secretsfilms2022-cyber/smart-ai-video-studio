name: Build OpenChatCut container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/container.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'src/**'
      - 'shared/**'
      - 'remotion/**'
      - 'config/**'
      - 'scripts/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-ai-video-studio:latest
            ghcr.io/${{ github.repository_owner }}/smart-ai-video-studio:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Smart Digital Studio AI Video Studio OpenChatCut runtime
            org.opencontainers.image.licenses=AGPL-3.0-or-later
